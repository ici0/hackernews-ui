apiVersion: apps/v1
kind: Deployment
metadata:
  name: hidden-sync
  labels:
    app: hidden-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hidden-sync
  template:
    metadata:
      labels:
        app: hidden-sync
    spec:
      containers:
        - name: hidden-sync
          image: python:3.12-alpine
          command:
            - python
            - /app/hidden_sync.py
            - --port=8017
            - --db=/data/hidden_ids.json
            - --path=__SECRET_PATH__
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
            - name: data
              mountPath: /data
        # TLS termination with automatic Let's Encrypt cert (page is served
        # over HTTPS, so the endpoint must be HTTPS too - mixed content)
        - name: tls
          image: caddy:2-alpine
          command:
            - caddy
            - reverse-proxy
            - --from=https://__SYNC_HOST__
            - --to=localhost:8017
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddy-data
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: hidden-sync-script
        - name: data
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hidden-sync
  labels:
    app: hidden-sync
spec:
  type: LoadBalancer
  selector:
    app: hidden-sync
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
